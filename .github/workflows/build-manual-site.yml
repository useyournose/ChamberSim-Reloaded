name: Build manual site

on:
  workflow_call:
    inputs:
      artifact_name:
        description: "Name of the artifact containing the prepared MkDocs files"
        required: false
        type: string
        default: folder

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - name: get folder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 ##v8.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: .

      - name: show files
        run: ls -alR

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.12"

      - name: Install requirements
        shell: bash
        run: pip install -r requirements.txt

      - name: Build site
        shell: bash
        env:
          MKDOCS_EXPORTER_PDF: false
        run: mkdocs build

      - name: upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 ##v7.0.2
        with:
          name: user-site
          path: site
          retention-days: 1
          overwrite: true
