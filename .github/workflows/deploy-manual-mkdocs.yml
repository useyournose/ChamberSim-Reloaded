# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - uyn-mdoku

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            docs/manual
            docs/build
            packaging/linux/chambersimreloaded.svg

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d #v6.0.0

      - name: prepare folders for mkdocs
        shell: bash
        working-directory: docs
        run: |
          mkdir -p build/docs
          mv manual/*.md build/docs/
          mv *.md build/docs/
          mv manual/images build/docs/
          mv build/javascripts build/docs/
          cp -r build/resources build/docs/
          ### when docs are split up, this needs to go.
          ##mv -f build/docs/manual.md build/docs/index.md

      - run: |
          cp packaging/linux/chambersimreloaded.svg docs/build/docs/images/favicon.svg

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.12"

      - name: Convert GFM alerts for MkDocs
        run: python docs/build/gfm_to_mkdocs.py docs/build/docs

      - name: lint md
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff #v24.2.0
        with:
          globs: 'docs/build/docs/*.md'
        continue-on-error: true

      - name: Install requirements
        shell: bash
        working-directory: docs/build
        run: |
          pip install -r requirements.txt

      - name: prep playwright
        shell: bash
        working-directory: docs/build
        run: |
          playwright install --with-deps --only-shell

      - name: Build site
        shell: bash
        working-directory: docs/build
        run: |
          mkdocs build

      - name: show files
        run: ls -alR 
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5.0.0
        with:
          path: 'docs/build/site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 #v5.0.1