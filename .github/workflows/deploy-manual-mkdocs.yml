# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - uyn-mdoku

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            docs/manual
      - name: lint md
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff #v24.2.0
        with:
          globs: 'docs/manual/ug_*.md'
        continue-on-error: true
  
  prep-folder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          sparse-checkout: |
            docs/manual
            docs/build
            packaging/linux/chambersimreloaded.svg

      - name: prepare folders for mkdocs
        shell: bash
        working-directory: docs
        run: |
          mkdir -p build/docs
          mv manual/*.md build/docs/
          mv *.md build/docs/
          mv manual/images build/docs/
          mv build/javascripts build/docs/
          cp -r build/resources build/docs/

      - run: |
          cp packaging/linux/chambersimreloaded.svg docs/build/docs/images/favicon.svg

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.12"

      - name: Convert GFM alerts for MkDocs
        run: python docs/build/gfm_to_mkdocs.py docs/build/docs

      - name: show files
        run: ls -alR 
        working-directory: docs

      - name: upload folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 ##v7.0.2
        with:
          name: folder
          path: docs/build
          retention-days: 1
          overwrite: true
  
  build-pdf:
    runs-on: ubuntu-latest
    needs: prep-folder
    steps:
      - name: get folder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 ##v8.0.2
        with:
          name: folder
          path: docs

      - name: show files
        run: ls -alR 
        working-directory: docs

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.12"

      - name: Install requirements
        shell: bash
        working-directory: docs/build
        run: |
          pip install -r requirements.txt

      - name: prep playwright
        shell: bash
        working-directory: docs/build
        run: |
          playwright install --with-deps --only-shell

      - name: Build combined manual PDF
        shell: bash
        working-directory: docs/build
        env:
          MKDOCS_EXPORTER_PDF: true
          MKDOCS_EXPORTER_PDF_ONLY: true
        run: |
          mkdocs build --site-dir pdf-site

      - name: upload guide
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 ##v7.0.2
        with:
          name: user-guide
          path: docs/build/pdf-site/ChamberSimReloaded-UserGuide.pdf
          retention-days: 1
          overwrite: true
        
  build-site:
    runs-on: ubuntu-latest
    needs: prep-folder
    steps:
      - name: get folder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 ##v8.0.2
        with:
          name: folder
          path: docs

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 #v7.0.0
        with:
          python-version: "3.12"

      - name: Install requirements
        shell: bash
        working-directory: docs/build
        run: |
          pip install -r requirements.txt

      - name: Build site
        shell: bash
        working-directory: docs/build
        env:
          MKDOCS_EXPORTER_PDF: false
        run: mkdocs build

      - name: upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 ##v7.0.2
        with:
          name: user-site
          path: docs/build/site
          retention-days: 1
          overwrite: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write
    needs: [build-pdf,build-site]
    runs-on: ubuntu-latest
    steps:
      - name: get artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 ##v8.0.2
        with:
          pattern: user-*
          path: site
             
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d #v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 #v5.0.0
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 #v5.0.1
