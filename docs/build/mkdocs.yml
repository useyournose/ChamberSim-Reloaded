site_name: ChamberSim-Reloaded User Guide
site_url: https://GITHUB_USERNAME.github.io
site_author: you
site_description: a short description of your website

nav:
  - User Guide: index.md

theme:
  name: material 
  highlightjs: true
  hljs_languages:
    - yaml
  features:
    - navigation.sections
    - navigation.expand
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

  - pymdownx.highlight
  - pymdownx.superfences

  # Math support
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js