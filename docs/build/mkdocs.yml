site_name: ChamberSim-Reloaded User Guide
site_url: https://GITHUB_USERNAME.github.io
site_author: you
site_description: a short description of your website
repo_name: Schuldkroet/ChamberSim-Reloaded
repo_url: https://github.com/Schildkroet/ChamberSim-Reloaded
nav:
  - User Guide: index.md
#  - Home: index.md
#  - Installation: installation.md
#  - Main window: window.md
#  - tools: tools.md
#  - troubleshooting: troubleshooting.md
#  - glossary: glossary.md


theme:
  name: material 
  features:
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - toc.follow
    - navigation.footer
  logo: images/logo.png

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

  - pymdownx.highlight
  - pymdownx.superfences

  # Math support
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Schildkroet
plugins:      
  - exporter:
      formats:
        pdf:
          enabled: !ENV [MKDOCS_EXPORTER_PDF, true]
          concurrency: 8
          aggregator:
            enabled: true
            output: documentation.pdf
            covers: all